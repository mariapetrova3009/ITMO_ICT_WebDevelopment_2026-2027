{% extends "hotel/base.html" %}
{% block title %}Номера{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Номера</h1>
<div class="table-responsive mb-4">
<table class="table table-striped table-bordered bg-white">
<thead>
<tr>
<th scope="col">Номер</th>
<th scope="col">Этаж</th>
<th scope="col">Тип номера</th>
<th scope="col">Вместимость</th>
<th scope="col">Цена за ночь</th>
<th scope="col">Телефон</th>
</tr>
</thead>
<tbody id="rows">
</tbody>
</table>
<p id="empty" class="text-secondary">Загрузка…</p>
</div>
<section class="card card-body">
<h2 class="h5">Добавить номер</h2>
<form id="create-form" class="row g-3">{% csrf_token %}
<div class="col-md-6">
<label class="form-label" for="number">Номер</label>
<input class="form-control" type="text" id="number" name="number" maxlength="10" required>
</div>
<div class="col-md-6">
<label class="form-label" for="floor">Этаж</label>
<select class="form-select" id="floor" name="floor" required>
</select>
</div>
<div class="col-md-6">
<label class="form-label" for="room_type">Тип номера</label>
<select class="form-select" id="room_type" name="room_type" required>
</select>
</div>
<div class="col-md-6">
<label class="form-label" for="phone">Телефон</label>
<input class="form-control" type="text" id="phone" name="phone" maxlength="30" required>
</div>
<div class="col-12">
<button type="submit" class="btn btn-primary" disabled>Создать</button>
</div>
</form>
</section>
{% endblock %}
{% block scripts %}<script>
const roomsUrl = "{% url 'hotel_app:room-list' %}";
async function loadRooms() {
    const [rooms, floors, types] = await Promise.all([
        api(roomsUrl), api("{% url 'hotel_app:floor-list' %}"), api("{% url 'hotel_app:room-type-list' %}")
    ]);
    fillSelect('floor', floors, floor => floor.number);
    fillSelect('room_type', types, type => `${type.name} (${type.capacity} чел., ${type.price_per_night} руб./ночь)`);
    fillTable('rows', rooms.map(room => {
        const type = types.find(type => type.id === room.room_type);
        return [room.number, floors.find(floor => floor.id === room.floor)?.number,
            type?.name, type?.capacity, type?.price_per_night, room.phone];
    }));
    document.getElementById('empty').textContent = rooms.length ? '' : 'Номеров пока нет.';
    document.querySelector('#create-form button').disabled = !floors.length || !types.length;
    if (!floors.length || !types.length) showMessage('Для создания номера сначала добавьте этажи и типы номеров через существующий API.');
}
bindForm(roomsUrl, 'Номер создан.', loadRooms);
loadRooms().catch(error => showMessage(error.message));
</script>{% endblock %}
