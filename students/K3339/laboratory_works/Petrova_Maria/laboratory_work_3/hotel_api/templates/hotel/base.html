{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — Администратор гостиницы</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-white border-bottom" aria-label="Основное меню">
  <div class="container gap-3">
    <span class="navbar-brand">Администратор гостиницы</span>
    <div class="d-flex gap-3">
      <a href="{% url 'hotel-rooms' %}">Номера</a>
      <a href="{% url 'hotel-guests' %}">Гости</a>
      <a href="{% url 'hotel-check-in' %}">Заселение</a>
    </div>
    <form method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<button class="btn btn-outline-secondary btn-sm">Выйти</button></form>
  </div>
</nav>
<main class="container py-4">
  <div id="message" class="alert d-none" role="status" aria-live="polite"></div>
  <noscript><div class="alert alert-warning">Для загрузки данных и отправки форм включите JavaScript.</div></noscript>
  {% block content %}{% endblock %}
</main>
<script src="{% static 'js/hotel.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
