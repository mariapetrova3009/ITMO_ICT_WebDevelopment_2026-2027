{% extends 'project_first_app/base.html' %}

{% block title %}
Регистрация
{% endblock %}


{% block content %}

<h1 class="mb-4">Регистрация</h1>

<div class="row">
    <div class="col-md-6">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Зарегистрироваться
            </button>

        </form>

    </div>
</div>

{% endblock %}
