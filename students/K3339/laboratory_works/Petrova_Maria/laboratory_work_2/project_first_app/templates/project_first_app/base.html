<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Hotel Service{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'room_list' %}">
            Hotel Service
        </a>

        <div class="navbar-nav me-auto">

            <a
                class="nav-link"
                href="{% url 'room_list' %}"
            >
                Номера
            </a>

            {% if user.is_authenticated %}

                <a
                    class="nav-link"
                    href="{% url 'my_reservations' %}"
                >
                    Мои бронирования
                </a>

                {% if user.is_staff %}

                    <a
                        class="nav-link"
                        href="{% url 'recent_guests' %}"
                    >
                        Постояльцы
                    </a>

                {% endif %}

            {% endif %}

        </div>


        <div class="navbar-nav align-items-center">

            {% if user.is_authenticated %}

                <span class="navbar-text me-3">
                    {{ user.username }}
                </span>

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    class="mb-0"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-outline-light"
                    >
                        Выйти
                    </button>
                </form>

            {% else %}

                <a
                    class="nav-link"
                    href="{% url 'login' %}"
                >
                    Войти
                </a>

                <a
                    class="nav-link"
                    href="{% url 'register' %}"
                >
                    Регистрация
                </a>

            {% endif %}

        </div>

    </div>
</nav>


<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
